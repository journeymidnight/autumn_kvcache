name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    # No cluster and no engine: the key / model-scope logic, the interface
    # resolution, and that the adapters import against the published client.
    # The sglang backend imports numpy.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . numpy pytest
      - run: python -m pytest tests/test_model_identity.py tests/test_iface_resolution.py -q
      - run: python -c "import autumn, autumn_kvcache.sglang_backend"
