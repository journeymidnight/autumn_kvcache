[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autumn-kvcache"
version = "0.1.1"
description = "sglang HiCache L3 and vLLM KV-connector backends on autumn-rs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "autumn-rs contributors" }]
dependencies = [
  # The native client, `import autumn`. Pinned: it must be the release that
  # matches AUTUMN_REV (see README, "Which autumn-rs this tracks").
  "autumn-rs==0.1.2",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/journeymidnight/autumn_kvcache"

[project.optional-dependencies]
sglang = []  # sglang itself is not a hard dep; this is just a marker.

[tool.setuptools.packages.find]
include = ["autumn_kvcache*"]
exclude = ["tests*"]
